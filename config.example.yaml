# ============================================================
#  Signal Relay — کانفیگ
#  مقادیر ${VAR} از فایل .env یا متغیرهای محیطی خوانده می‌شوند
# ============================================================

server:
  secret: ${WEBHOOK_SECRET}          # حداقل ۱۲ کاراکتر. در URL، هدر X-Webhook-Secret یا فیلد passphrase
  allowed_ips: []                    # مثلاً ["1.2.3.4"] — خالی = همه
  dedupe_seconds: 30                 # سیگنال تکراری با همان id در این بازه نادیده گرفته می‌شود

signal:
  # freqtrade : پیام‌های وب‌هوک Freqtrade (قالب آماده در freqtrade/webhook-config.json)
  # generic   : هر JSON دیگری (TradingView و ...) با نگاشت فیلدهای پایین
  source: freqtrade
  freqtrade:
    # fill  : فقط وقتی سفارش خود Freqtrade پر شد کپی شود (entry_fill / exit_fill) — پیشنهادی
    # order : به محض ثبت سفارش در Freqtrade (entry / exit) — سریع‌تر، ولی اگر سفارش limit کنسل شود برنمی‌گردد
    relay_on: fill

  # ---- فقط برای source: generic ----
  # اسم فیلدها در JSONی که منبع سیگنال می‌فرستد (مسیر نقطه‌دار هم مجاز است، مثل data.side)
  fields:
    action: action
    symbol: symbol
    price: price
    id: id
    size_multiplier: size_multiplier # اختیاری: ضریب حجم برای هر سیگنال
    passphrase: passphrase
  # اگر منبع شما کلمات دیگری می‌فرستد اینجا به اکشن استاندارد نگاشت کنید
  # اکشن‌های استاندارد: long, short, close_long, close_short, close
  action_aliases:
    buy: long
    sell: short
    exit: close
  symbol_cleanup:
    strip_exchange_prefix: true      # BINANCE:BTCUSDT -> BTCUSDT
    strip_suffixes: [".P", "PERP"]   # BTCUSDT.P -> BTCUSDT

accounts:
  # ---------- بایننس فیوچرز: ۵۰ تتر مارجین با لوریج ۱۰ ----------
  - name: binance_main
    type: ccxt
    exchange: binanceusdm
    api_key: ${BINANCE_KEY}
    secret: ${BINANCE_SECRET}
    market_type: swap
    leverage: 10
    margin_mode: isolated
    order_type: market
    sizing:
      mode: fixed_quote              # amount = مارجین به تتر → ارزش پوزیشن = 50 × 10 = 500
      amount: 50
      max_notional: 1000             # سقف ارزش هر سفارش
    dry_run: true                    # اول تست کنید، بعد false کنید
    sandbox: false

  # ---------- بیت‌گت: دقیقاً نصف استیک Freqtrade ----------
  - name: bitget_copy
    type: ccxt
    exchange: bitget
    api_key: ${BITGET_KEY}
    secret: ${BITGET_SECRET}
    password: ${BITGET_PASSPHRASE}
    market_type: swap
    leverage: 5
    sizing:
      mode: copy_stake               # amount = نسبت به مارجین Freqtrade (1 = همان، 0.5 = نصف)
      amount: 0.5
    dry_run: true
    enabled: false

  # ---------- بای‌بیت: ۵٪ موجودی، لوریج ۵، فقط BTC و ETH ----------
  - name: bybit_alt
    type: ccxt
    exchange: bybit
    api_key: ${BYBIT_KEY}
    secret: ${BYBIT_SECRET}
    market_type: swap
    leverage: 5
    sizing:
      mode: percent_balance          # amount = درصد موجودی آزاد
      amount: 5
    allowed_symbols: [BTCUSDT, ETHUSDT]
    dry_run: true

  # ---------- OKX اسپات: مقدار ثابت ارز پایه ----------
  - name: okx_spot
    type: ccxt
    exchange: okx
    api_key: ${OKX_KEY}
    secret: ${OKX_SECRET}
    password: ${OKX_PASSPHRASE}      # OKX / KuCoin / Bitget پسفریز هم می‌خواهند
    market_type: spot
    sizing:
      mode: fixed_base               # amount = مقدار ارز (مثلاً 0.001 BTC)
      amount: 0.001
    symbol_map:                      # نگاشت دستی نماد در صورت نیاز
      BTCUSDT: BTC/USDT
    allowed_actions: [long, close]   # در اسپات short معنی ندارد
    enabled: false

  # ---------- هر API دلخواه (صرافی ایرانی، ربات خودتان، ...) ----------
  - name: my_custom_api
    type: http
    url: https://example.com/api/order
    method: POST
    headers:
      Authorization: Bearer ${CUSTOM_API_TOKEN:-changeme}
    sizing:
      amount: 100
    symbol_map:
      BTCUSDT: BTC-USDT
    # placeholderها: {action} {side} {symbol} {pair} {price} {amount} {close_fraction} {stake} {leverage} {id} {account} {raw_<field>} {signal}
    body_template:
      market: "{symbol}"
      side: "{side}"
      amount: "{amount}"
      price: "{price}"
      client_id: "relay-{id}"
    retries: 2
    timeout: 10
    enabled: false
