{% extends "base.html" %}{% block content %}<div class="auth card">
<h1>{{ _('nav_register') }}</h1>
<form method="post" action="/register"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>{{ _('f_name') }}</label><input type="text" name="name" value="{{ form.name }}" required>
<label>{{ _('f_email') }}</label><input class="ltr" type="email" name="email" value="{{ form.email }}" required>
<label>{{ _('f_phone') }}</label><input class="ltr" type="text" name="phone" value="{{ form.phone }}">
<label>{{ _('f_password_new') }}</label><input class="ltr" type="password" name="password" required minlength="8">
<label>{{ _('f_password_repeat') }}</label><input class="ltr" type="password" name="password2" required minlength="8">
<label class="check"><input type="checkbox" name="terms" required><span>{{ _('f_terms') }}</span></label>
<p><button>{{ _('nav_register') }}</button></p></form>
<p class="muted">{{ _('have_account') }} <a href="/login">{{ _('nav_login') }}</a></p>
</div>{% endblock %}
