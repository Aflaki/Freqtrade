{% extends "base.html" %}{% block title %}2FA · {{ site.site_name }}{% endblock %}{% block content %}<div class="auth card">
<h1>🛡 {{ _('twofa_title') }}</h1><p class="muted">{{ _('twofa_enter') }}</p>
<form method="post" action="/login/2fa"><input type="hidden" name="csrf" value="{{ csrf }}">
<input class="ltr otp" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required autofocus placeholder="123 456">
<p><button class="wide">{{ _('btn_verify') }}</button></p></form>
<details class="small"><summary>{{ _('twofa_lost') }}</summary><p class="muted">{{ _('twofa_lost_help') }}</p></details>
<p class="center small"><a href="/login">{{ _('btn_cancel') }}</a></p>
</div>{% endblock %}
