{% extends "base.html" %}{% block content %}<div class="auth card">
<h1>{{ _('nav_login') }}</h1>
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>{{ _('f_email') }}</label><input class="ltr" type="email" name="email" required autofocus>
<label>{{ _('f_password') }}</label><input class="ltr" type="password" name="password" required>
<p><button>{{ _('nav_login') }}</button></p></form>
<p class="muted">{{ _('no_account') }} <a href="/register">{{ _('nav_register') }}</a></p>
</div>{% endblock %}
