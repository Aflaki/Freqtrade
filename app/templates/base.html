<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}پنل معاملات{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if user %}
<nav class="nav"><div class="in">
  <a class="brand" href="/">پنل معاملات</a>
  {% set p = request.url.path %}
  <a href="/" class="{{ 'on' if p == '/' }}">داشبورد</a>
  <a href="/accounts" class="{{ 'on' if p.startswith('/accounts') }}">صرافی‌ها و سرمایه</a>
  <a href="/trades" class="{{ 'on' if p == '/trades' }}">معاملات</a>
  <a href="/settings" class="{{ 'on' if p == '/settings' }}">تنظیمات و تلگرام</a>
  {% if user.is_admin %}<a href="/admin" class="{{ 'on' if p.startswith('/admin') }}">مدیریت</a>{% endif %}
  <form class="inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost sm">خروج</button></form>
</div></nav>
{% endif %}
<main>
{% for kind, msg in flashes %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body></html>
